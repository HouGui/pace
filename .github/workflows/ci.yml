name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python3 tools/check_project.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lvgl/lvgl
          ref: c016f72d4c125098287be5e83c0f1abed4706ee5 # v9.4.0, same release as firmware
          path: build-lvgl
          persist-credentials: false
      - run: cmake -S . -B build-host -G Ninja -DPACE_SANITIZERS=ON -DPACE_LVGL_SOURCE_DIR="$PWD/build-lvgl"
      - run: cmake --build build-host
      - run: ctest --test-dir build-host --output-on-failure
      - run: PACE_FEED_CHECK="$PWD/build-host/pace_feed_check" node tests/adapters.test.mjs
      - run: PACE_FEED_CHECK="$PWD/build-host/pace_feed_check" node tests/setup.test.mjs
      - run: npm ci --ignore-scripts
        working-directory: adapters/service
      - run: git diff --check
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross-build ESP32-S3
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
          idf.py size
