<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="850" viewBox="0 0 1340 850" role="img"><title>PACE module-level circuit sketch: integrated color display and SHT40 sensor</title><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif} path{stroke-linecap:round;stroke-linejoin:round}</style>
