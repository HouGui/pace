<text x="590" y="699" font-size="18" font-weight="normal" fill="#172b36" text-anchor="start">Sensor: integrated vented cradle below the display.</text>
<text x="590" y="730" font-size="18" font-weight="normal" fill="#172b36" text-anchor="start">No external button, breadboard or outdoor probe needed.</text>
<text x="45" y="804" font-size="18" font-weight="normal" fill="#172b36" text-anchor="start">Signal-level sketch, not a connector-face pinout. Verify H1/H2 labels on the purchased revision.</text>
