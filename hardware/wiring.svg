<text x="80" y="522" font-size="16" font-weight="normal" fill="#172b36" text-anchor="start">and bus pull-ups</text>
<text x="80" y="601" font-size="18" font-weight="bold" fill="#172b36" text-anchor="start">USB-to-UART · selector = UART1</text>
